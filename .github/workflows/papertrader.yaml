name: Papertrader

on:
  schedule:
    - cron: "*/30 * * * *"   # Konto aktualisieren, rund um die Uhr (Krypto läuft immer)
    - cron: "0 9 * * 0"      # sonntags: Bilanz aufs Handy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: papertrader
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install yfinance pandas numpy

      - name: Paper-Konto aktualisieren
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 9 * * 0" ]; then
            python papertrader.py bericht
          else
            python papertrader.py
          fi

      - name: Stand speichern
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add paper_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nichts zu speichern"
          else
            git commit -m "Paper-Konto"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
